name: dung_de_thay_thay
description: "Nhất Quỷ Nhì Ma - game stealth-comedy 2D lớp học Việt Nam, Flutter + Flame."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.33.0
  shared_preferences: ^2.5.6
  flame_audio: ^2.12.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/branding/
    - assets/images/
